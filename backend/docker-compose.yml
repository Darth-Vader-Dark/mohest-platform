version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mohest
      POSTGRES_PASSWORD: mohest_dev_password
      POSTGRES_DB: mohest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "4000:4000"
    command: sh -c "(npx prisma migrate deploy || npx prisma db push) && node dist/main"

volumes:
  postgres-data:
